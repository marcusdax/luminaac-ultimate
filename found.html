<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>If found · LuminAAC</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#22313d" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    body { margin: 0; min-height: 100vh; background: var(--fog); color: var(--ink); font: 400 1.125rem/1.5 var(--font, system-ui, sans-serif); }
    header { background: var(--dusk); color: #fff; padding: 20px 16px; text-align: center; }
    header h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: 6px 0 0; color: var(--lumen); font-weight: 700; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .photo { display: block; width: 160px; height: 160px; object-fit: cover; border-radius: 16px; margin: 0 auto 12px; border: 3px solid var(--paper-raised); }
    .speaks { font-size: 1.35rem; font-weight: 800; text-align: center; margin: 8px 0 16px; }
    section { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin: 0 0 12px; }
    section h2 { margin: 0 0 4px; font-size: 1rem; color: var(--ink-soft); }
    section p { margin: 0; }
    .call { display: block; text-align: center; text-decoration: none; background: #b8372f; color: #fff; font-weight: 800; font-size: 1.35rem; padding: 18px; border-radius: 16px; margin: 0 0 10px; min-height: 44px; }
    .call.two { background: var(--dusk); font-size: 1.1rem; }
    .soft { color: var(--ink-soft); font-size: .95rem; text-align: center; }
    .err { text-align: center; padding: 40px 16px; }
  </style>
</head>
<body>
  <header><h1 id="who">If found</h1><p>Please help. I can't tell you who I am.</p></header>
  <main id="main" aria-live="polite"><p class="soft">Loading…</p></main>
  <script type="module" src="found.js"></script>
</body>
</html>
