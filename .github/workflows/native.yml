name: Native app builds (unsigned, not published)
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "screenshots/**"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build for the iOS simulator (macOS runner)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
      - run: cd backend && node test.mjs
  android:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        # The default package list includes the legacy "tools" package, which
        # cmdline-tools 16+ no longer ships, so sdkmanager exits 1. Gradle
        # installs the platform and build-tools it needs on its own.
        with: { packages: platform-tools }
      - name: Add the Android project
        working-directory: native
        run: npm install && npm run add:android && npx cap sync android && node native-config.mjs android
      - name: Build a debug APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: luminaac-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Add the iOS project
        working-directory: native
        run: npm install && npm run add:ios && npx cap sync ios && node native-config.mjs ios
      - name: Simulator build, no signing
        working-directory: native/ios/App
        run: xcodebuild -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -20
